# source: hand-authored
# Tool policy for s2-test-author. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-test-author
description: "Writes tests inside testWrites before any code exists."
scope: agent
default_action: deny
rules:
  - name: deny-preview-update
    condition: "tool_name == 'run_command' and args.updates_snapshots == 'true'"
    action: deny
    message: "previews are approved in designc; the Factory never updates them"
    priority: 100
  - name: deny-ui-contract-shell
    condition: "tool_name == 'run_command' and args.touches_ui_contract == 'true'"
    action: deny
    message: "shell commands may not change the UI contract files or reach the holdout"
    priority: 100
  - name: deny-ui-contract-write
    condition: "tool_name == 'write_file' and args.ui_protected_path == 'true'"
    action: deny
    message: "the UI contract files (previews, specs, manifests, page tests, Vitest config) are the Factory's seeded baseline; build roles never write them"
    priority: 100
  - name: deny-ui-contract-write-delete
    condition: "tool_name == 'delete_file' and args.ui_protected_path == 'true'"
    action: deny
    message: "the UI contract files (previews, specs, manifests, page tests, Vitest config) are the Factory's seeded baseline; build roles never write them"
    priority: 100
  - name: deny-holdout-read
    condition: "tool_name == 'read_file' and args.reads_holdout == 'true'"
    action: deny
    message: "holdout samples are not for any agent: they are never read or listed"
    priority: 100
  - name: deny-holdout-read-list
    condition: "tool_name == 'list_files' and args.reads_holdout == 'true'"
    action: deny
    message: "holdout samples are not for any agent: they are never read or listed"
    priority: 100
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-read-reference
    condition: "tool_name == 'read_reference'"
    action: allow
    priority: 10
  - name: allow-list-reference
    condition: "tool_name == 'list_reference'"
    action: allow
    priority: 10
  - name: allow-write-file
    condition: "tool_name == 'write_file'"
    action: allow
    priority: 10
  - name: allow-delete-file
    condition: "tool_name == 'delete_file'"
    action: allow
    priority: 10
  - name: deny-no-verify
    condition: "tool_name == 'run_command' and args.skips_hooks == 'true'"
    action: deny
    message: "--no-verify is not allowed: hooks are not skipped"
    priority: 100
  - name: allow-run-command
    condition: "tool_name == 'run_command'"
    action: allow
    priority: 10
  - name: allow-declare-done
    condition: "tool_name == 'declare_done'"
    action: allow
    priority: 10
  - name: allow-raise-needs-decision
    condition: "tool_name == 'raise_needs_decision'"
    action: allow
    priority: 10
  - name: allow-declare-equivalent
    condition: "tool_name == 'declare_equivalent'"
    action: allow
    priority: 10
