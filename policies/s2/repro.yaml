# source: hand-authored
# Tool policy for s2-repro. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-repro
description: "Drives a browser to reproduce a reported escape; the spec reaches tests/acceptance via intake only."
scope: agent
default_action: deny
rules:
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-playwright-cli
    condition: "tool_name == 'playwright_cli'"
    action: allow
    priority: 10
  - name: allow-submit-reproduction
    condition: "tool_name == 'submit_reproduction'"
    action: allow
    priority: 10
