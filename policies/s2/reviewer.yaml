# source: hand-authored
# Tool policy for s2-reviewer. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-reviewer
description: "Judges one task's green diff: read-only, submits findings."
scope: agent
default_action: deny
rules:
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-submit-review
    condition: "tool_name == 'submit_review'"
    action: allow
    priority: 10
  - name: allow-confirm-equivalents
    condition: "tool_name == 'confirm_equivalents'"
    action: allow
    priority: 10
