# source: hand-authored
# Tool policy for s2-task-planner. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-task-planner
description: "Per-task approach note: read-only, may raise a needs-decision."
scope: agent
default_action: deny
rules:
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-raise-needs-decision
    condition: "tool_name == 'raise_needs_decision'"
    action: allow
    priority: 10
  - name: allow-submit-approach
    condition: "tool_name == 'submit_approach'"
    action: allow
    priority: 10
