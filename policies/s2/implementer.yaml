# source: hand-authored
# Tool policy for s2-implementer. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-implementer
description: "Writes code inside writes; the tests are fixed by then."
scope: agent
default_action: deny
rules:
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-write-file
    condition: "tool_name == 'write_file'"
    action: allow
    priority: 10
  - name: allow-delete-file
    condition: "tool_name == 'delete_file'"
    action: allow
    priority: 10
  - name: allow-run-command
    condition: "tool_name == 'run_command'"
    action: allow
    priority: 10
  - name: allow-declare-done
    condition: "tool_name == 'declare_done'"
    action: allow
    priority: 10
  - name: allow-raise-needs-decision
    condition: "tool_name == 'raise_needs_decision'"
    action: allow
    priority: 10
  - name: allow-return-to-test-author
    condition: "tool_name == 'return_to_test_author'"
    action: allow
    priority: 10
  - name: allow-check-quality
    condition: "tool_name == 'check_quality'"
    action: allow
    priority: 10
