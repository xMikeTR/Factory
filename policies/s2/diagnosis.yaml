# source: hand-authored
# Tool policy for s2-diagnosis. Loaded by Factory.Harness.Governance.AcsToolPolicy (AGT PolicyEngine).
# Paths are enforced by ScopedWorkspace whatever this file says; this file decides which tools the role may call.
# When mlang compiles these, the header becomes '# source: mlang@<version>'.
apiVersion: governance.toolkit/v1
version: "1"
name: s2-diagnosis
description: "Read-only: explains a TranslationError from the trace; its finding goes to the ledger."
scope: agent
default_action: deny
rules:
  - name: allow-read-file
    condition: "tool_name == 'read_file'"
    action: allow
    priority: 10
  - name: allow-list-files
    condition: "tool_name == 'list_files'"
    action: allow
    priority: 10
  - name: allow-playwright-cli
    condition: "tool_name == 'playwright_cli'"
    action: allow
    priority: 10
  - name: allow-submit-diagnosis
    condition: "tool_name == 'submit_diagnosis'"
    action: allow
    priority: 10
